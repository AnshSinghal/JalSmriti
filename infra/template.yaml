AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  JalSmriti - water remembers. Satellite water memory and summer heat for every lake and place in India and Nepal,
  citizen evidence and standing-water reports, signed dossiers and place reports, lake-watch and rain heads-up
  emails, and reports read aloud. Deployed by deploy.py.

Parameters:
  Project:
    Type: String
    Default: jalsmriti
    AllowedPattern: "^[a-z][a-z0-9-]{2,20}$"
  CodeBucket:
    Type: String
    Description: Bucket holding the Lambda code and layers (created and filled by deploy.py)
  CodeKey:
    Type: String
  GeoLayerKey:
    Type: String
  AppLayerKey:
    Type: String
  CurrentSeason:
    Type: String
    Default: "2026"
  TextModelIds:
    Type: String
    Default: "us.amazon.nova-lite-v1:0,amazon.nova-lite-v1:0,us.amazon.nova-pro-v1:0"
  VisionModelIds:
    Type: String
    Default: "us.amazon.nova-lite-v1:0,amazon.nova-lite-v1:0"
  Website:
    Type: String
    Default: cloudfront
    AllowedValues: [cloudfront, api]
    Description: >
      cloudfront: the website, public data and API behind Amazon CloudFront (the normal setup). api: no CloudFront;
      API Gateway serves the website and public data straight from the site bucket. deploy.py chooses api only when AWS
      has not yet verified a brand-new account for CloudFront.

Conditions:
  UseCdn: !Equals [!Ref Website, cloudfront]
  NoCdn: !Equals [!Ref Website, api]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Tracing: Active
    Environment:
      Variables:
        PROJECT: !Ref Project
        TABLE_NAME: !Ref Table
        DATA_BUCKET: !Ref DataBucket
        SITE_BUCKET: !Ref SiteBucket
        SITE_URL_PARAM: !Sub "/${Project}/site-url"
        KMS_KEY_ID: !Ref SigningKey
        JOBS_QUEUE_URL: !Ref JobsQueue
        CURRENT_SEASON: !Ref CurrentSeason
        TEXT_MODEL_IDS: !Ref TextModelIds
        VISION_MODEL_IDS: !Ref VisionModelIds
        POWERTOOLS_SERVICE_NAME: !Ref Project
        POWERTOOLS_LOG_LEVEL: INFO

Resources:
  # ----------------------------------------------------------------------------------------- data
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref Project
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
        - {AttributeName: GSI1PK, AttributeType: S}
        - {AttributeName: GSI1SK, AttributeType: S}
        - {AttributeName: GSI2PK, AttributeType: S}
        - {AttributeName: GSI2SK, AttributeType: S}
        - {AttributeName: GSI3PK, AttributeType: S}
        - {AttributeName: GSI3SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema: [{AttributeName: GSI1PK, KeyType: HASH}, {AttributeName: GSI1SK, KeyType: RANGE}]
          Projection: {ProjectionType: ALL}
        - IndexName: GSI2
          KeySchema: [{AttributeName: GSI2PK, KeyType: HASH}, {AttributeName: GSI2SK, KeyType: RANGE}]
          Projection: {ProjectionType: ALL}
        - IndexName: GSI3
          KeySchema: [{AttributeName: GSI3PK, KeyType: HASH}, {AttributeName: GSI3SK, KeyType: RANGE}]
          Projection: {ProjectionType: ALL}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      SSESpecification: {SSEEnabled: true}

  DataBucket:
    Type: AWS::S3::Bucket
    DependsOn: EvidenceQueuePolicy
    Properties:
      BucketName: !Sub "${Project}-data-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      CorsConfiguration:
        CorsRules:
          - {AllowedMethods: [POST, PUT], AllowedOrigins: ["*"], AllowedHeaders: ["*"], MaxAge: 3000}
      LifecycleConfiguration:
        Rules:
          - {Id: abort-multipart, Status: Enabled, AbortIncompleteMultipartUpload: {DaysAfterInitiation: 2}}
      NotificationConfiguration:
        QueueConfigurations:
          - Event: "s3:ObjectCreated:*"
            Queue: !GetAtt EvidenceQueue.Arn
            Filter: {S3Key: {Rules: [{Name: prefix, Value: evidence/}]}}

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Project}-site-${AWS::AccountId}-${AWS::Region}"
      # behind CloudFront the bucket stays private; without CloudFront, API Gateway reads the public website from it
      PublicAccessBlockConfiguration: !If
        - UseCdn
        - {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
        - {BlockPublicAcls: true, BlockPublicPolicy: false, IgnorePublicAcls: true, RestrictPublicBuckets: false}
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - !If
            - UseCdn
            - Sid: CloudFrontReadOnly
              Effect: Allow
              Principal: {Service: cloudfront.amazonaws.com}
              Action: s3:GetObject
              Resource: !Sub "${SiteBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
            - Sid: PublicWebsiteRead          # the same files CloudFront would serve: the website and /pub/ data
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource: !Sub "${SiteBucket.Arn}/*"

  # ----------------------------------------------------------------------------------------- queues and topics
  EvidenceDLQ:
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true}
  EvidenceQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 720
      SqsManagedSseEnabled: true
      RedrivePolicy: {deadLetterTargetArn: !GetAtt EvidenceDLQ.Arn, maxReceiveCount: 4}
  EvidenceQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EvidenceQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: s3.amazonaws.com}
            Action: sqs:SendMessage
            Resource: !GetAtt EvidenceQueue.Arn
            Condition:
              ArnLike: {aws:SourceArn: !Sub "arn:aws:s3:::${Project}-data-${AWS::AccountId}-${AWS::Region}"}
              StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
  JobsDLQ:
    Type: AWS::SQS::Queue
    Properties: {MessageRetentionPeriod: 1209600, SqsManagedSseEnabled: true}
  JobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 1800
      SqsManagedSseEnabled: true
      RedrivePolicy: {deadLetterTargetArn: !GetAtt JobsDLQ.Arn, maxReceiveCount: 3}

  # ----------------------------------------------------------------------------------------- signing key
  SigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: JalSmriti signing key for dossiers and place reports (ECDSA P-256). The private key never leaves KMS.
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      EnableKeyRotation: false
      PendingWindowInDays: 7
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: {AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"}
            Action: "kms:*"
            Resource: "*"
  SigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${Project}-signing"
      TargetKeyId: !Ref SigningKey

  # ----------------------------------------------------------------------------------------- people
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${Project}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: {CaseSensitive: false}
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
      Policies:
        PasswordPolicy: {MinimumLength: 10, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: false}
      Schema:
        - {Name: email, AttributeDataType: String, Required: true, Mutable: true}
        - {Name: jurisdictions, AttributeDataType: String, Mutable: true, StringAttributeConstraints: {MinLength: "0", MaxLength: "512"}}
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your JalSmriti verification code
        EmailMessage: "Welcome to JalSmriti. Your verification code is {####}"
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: false}
      UserAttributeUpdateSettings: {AttributesRequireVerificationBeforeUpdate: [email]}
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${Project}-web"
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      ReadAttributes: [email, email_verified, custom:jurisdictions]
      WriteAttributes: [email]
      AccessTokenValidity: 12
      IdTokenValidity: 12
      RefreshTokenValidity: 30
      TokenValidityUnits: {AccessToken: hours, IdToken: hours, RefreshToken: days}
  VerifierGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: verifier, Description: NGO and community verifiers of citizen evidence, Precedence: 3}
  OfficerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: officer, Description: Officials who respond to dossiers, Precedence: 2}
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: admin, Description: Operators, Precedence: 1}

  # ----------------------------------------------------------------------------------------- code
  GeoLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${Project}-geo"
      Description: rasterio (GDAL), numpy, shapely, Pillow
      ContentUri: {Bucket: !Ref CodeBucket, Key: !Ref GeoLayerKey}
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
      RetentionPolicy: Delete
  AppLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${Project}-app"
      Description: Powertools, Cedar, Strands Agents, fpdf2, HarfBuzz, segno, boto3
      ContentUri: {Bucket: !Ref CodeBucket, Key: !Ref AppLayerKey}
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
      RetentionPolicy: Delete

  ApiFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: {Bucket: !Ref CodeBucket, Key: !Ref CodeKey}
      FunctionName: !Sub "${Project}-api"
      LoggingConfig: {LogGroup: !Ref ApiFnLogs}
      Handler: api.handler
      Layers: [!Ref AppLayer]
      MemorySize: 1024
      Timeout: 29
      Environment:
        Variables:
          PLACE_SFN_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Project}-place"
          LAKE_SFN_ARN: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Project}-lake"
          USER_POOL_ID: !Ref UserPool
          # CloudFront adds this header to API requests; the API refuses requests without it (stack-unique value)
          ORIGIN_SECRET: !If [UseCdn, !Select [2, !Split ["/", !Ref AWS::StackId]], ""]
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - SQSSendMessagePolicy: {QueueName: !GetAtt JobsQueue.QueueName}
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub "${DataBucket.Arn}/evidence/*"
            - Effect: Allow
              Action: [states:StartExecution]
              Resource:
                - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Project}-place"
                - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Project}-lake"
            - Effect: Allow
              Action: [sns:CreateTopic, sns:Subscribe, sns:Unsubscribe, sns:GetSubscriptionAttributes]
              Resource: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Project}-lake-*"
            - Effect: Allow   # rain heads-up: one topic per person who follows places (test emails are published here)
              Action: [sns:CreateTopic, sns:Subscribe, sns:Unsubscribe, sns:GetSubscriptionAttributes, sns:Publish]
              Resource: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Project}-user-*"
            - Effect: Allow   # listen: Amazon Polly reads place and lake reports aloud; audio is cached under pub/speech/
              Action: [polly:SynthesizeSpeech]
              Resource: "*"
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${SiteBucket.Arn}/pub/speech/*"
            - Effect: Allow   # HeadObject on a missing key needs ListBucket to answer 404 instead of 403
              Action: [s3:ListBucket]
              Resource: !GetAtt SiteBucket.Arn
              Condition: {StringLike: {s3:prefix: ["pub/speech/*"]}}
            - Effect: Allow
              Action: [kms:GetPublicKey, kms:DescribeKey]
              Resource: !GetAtt SigningKey.Arn
            - Effect: Allow
              Action: [geo-places:Geocode]
              Resource: !Sub "arn:aws:geo-places:${AWS::Region}::provider/default"
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Project}/*"
      Events:
        Public:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: "/v1/{proxy+}", Method: ANY}
        Secure:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/v1/secure/{proxy+}"
            Method: ANY
            Auth: {Authorizer: CognitoJwt}

  GeoFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: {Bucket: !Ref CodeBucket, Key: !Ref CodeKey}
      FunctionName: !Sub "${Project}-geo"
      LoggingConfig: {LogGroup: !Ref GeoFnLogs}
      Handler: geo_worker.handler
      Layers: [!Ref GeoLayer]
      MemorySize: 3008          # the most a new AWS account allows; plenty for 30 m city grids
      Timeout: 900
      EphemeralStorage: {Size: 2048}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${SiteBucket.Arn}/pub/*"
            - Effect: Allow
              Action: [s3:ListBucket]
              Resource: !GetAtt SiteBucket.Arn
            - Effect: Allow
              Action: [sns:CreateTopic, sns:Publish]
              Resource: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Project}-lake-*"
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Project}/*"

  EvidenceFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: {Bucket: !Ref CodeBucket, Key: !Ref CodeKey}
      FunctionName: !Sub "${Project}-evidence"
      LoggingConfig: {LogGroup: !Ref EvidenceFnLogs}
      Handler: evidence_ingest.handler
      Layers: [!Ref GeoLayer]
      MemorySize: 2048
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "${DataBucket.Arn}/evidence/*"
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${SiteBucket.Arn}/pub/*"
            - Effect: Allow
              Action: [s3:DeleteObject]
              Resource: !Sub "${SiteBucket.Arn}/pub/evidence/*"
            - Effect: Allow
              Action: [rekognition:DetectModerationLabels, rekognition:DetectFaces, rekognition:DetectLabels,
                       rekognition:DetectText]
              Resource: "*"
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: ["arn:aws:bedrock:*::foundation-model/amazon.nova-*", !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*amazon.nova-*"]
      Events:
        Uploads:
          Type: SQS
          Properties:
            Queue: !GetAtt EvidenceQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  JobsFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: {Bucket: !Ref CodeBucket, Key: !Ref CodeKey}
      FunctionName: !Sub "${Project}-jobs"
      LoggingConfig: {LogGroup: !Ref JobsFnLogs}
      Handler: jobs.handler
      Layers: [!Ref AppLayer]
      MemorySize: 2048
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${SiteBucket.Arn}/pub/*"
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource: ["arn:aws:bedrock:*::foundation-model/amazon.nova-*", !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*amazon.nova-*"]
            - Effect: Allow
              Action: [translate:TranslateText]
              Resource: "*"
            - Effect: Allow
              Action: [kms:Sign, kms:GetPublicKey, kms:DescribeKey]
              Resource: !GetAtt SigningKey.Arn
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Project}/*"
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt JobsQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]

  AlertsFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: {Bucket: !Ref CodeBucket, Key: !Ref CodeKey}
      FunctionName: !Sub "${Project}-alerts"
      Description: Daily rain heads-up for followed places (Open-Meteo forecast, Amazon SNS email)
      LoggingConfig: {LogGroup: !Ref AlertsFnLogs}
      Handler: alerts.handler
      Layers: [!Ref AppLayer]
      MemorySize: 512
      Timeout: 600
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref Table}
        - Statement:
            - Effect: Allow
              Action: [sns:CreateTopic, sns:Publish]
              Resource: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Project}-user-*"
            - Effect: Allow
              Action: [ssm:GetParameter]
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Project}/*"

  ApiFnLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/${Project}/api", RetentionInDays: 30}
  GeoFnLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/${Project}/geo", RetentionInDays: 30}
  EvidenceFnLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/${Project}/evidence", RetentionInDays: 30}
  JobsFnLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/${Project}/jobs", RetentionInDays: 30}
  AlertsFnLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/${Project}/alerts", RetentionInDays: 30}

  # ----------------------------------------------------------------------------------------- API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings: {ThrottlingBurstLimit: 100, ThrottlingRateLimit: 50}
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]

  # ----------------------------------------------------------------------------------------- workflows
  AreaStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${Project}-area"
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy: {FunctionName: !Ref GeoFn}
        - S3ReadPolicy: {BucketName: !Ref DataBucket}
        - Statement:
            - Effect: Allow
              Action: [states:StartExecution]
              Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Project}-area"
            - Effect: Allow
              Action: [states:DescribeExecution, states:StopExecution]
              Resource:
                - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${Project}-area:*"
                - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${Project}-area/*"
            - Effect: Allow
              Action: [states:DescribeMapRun, states:UpdateMapRun, states:ListMapRuns]
              Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:mapRun:${Project}-area/*"
      DefinitionUri: statemachines/area.asl.json
      DefinitionSubstitutions:
        GeoFnArn: !GetAtt GeoFn.Arn
        DataBucket: !Ref DataBucket

  PlaceStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${Project}-place"
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy: {FunctionName: !Ref GeoFn}
      DefinitionUri: statemachines/place.asl.json
      DefinitionSubstitutions:
        GeoFnArn: !GetAtt GeoFn.Arn

  LakeStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${Project}-lake"
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy: {FunctionName: !Ref GeoFn}
      DefinitionUri: statemachines/lake.asl.json
      DefinitionSubstitutions:
        GeoFnArn: !GetAtt GeoFn.Arn

  WeeklyStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${Project}-weekly"
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy: {FunctionName: !Ref GeoFn}
      DefinitionUri: statemachines/weekly.asl.json
      DefinitionSubstitutions:
        GeoFnArn: !GetAtt GeoFn.Arn

  PreloadStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub "${Project}-preload"
      Type: STANDARD
      Policies:
        - Statement:
            - Effect: Allow
              Action: [states:StartExecution]
              Resource: !Ref AreaStateMachine
            - Effect: Allow
              Action: [states:DescribeExecution, states:StopExecution]
              Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:${Project}-area:*"
            - Effect: Allow
              Action: [events:PutTargets, events:PutRule, events:DescribeRule]
              Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForStepFunctionsExecutionRule"
      DefinitionUri: statemachines/preload.asl.json
      DefinitionSubstitutions:
        AreaSfnArn: !Ref AreaStateMachine

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}}
      Policies:
        - PolicyName: start-weekly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref WeeklyStateMachine
        - PolicyName: run-rain-check
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AlertsFn.Arn

  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${Project}-weekly-watch"
      Description: Every Monday 02:30 IST - check watched lakes and refresh the latest satellite look of each area
      ScheduleExpression: "cron(30 2 ? * MON *)"
      ScheduleExpressionTimezone: Asia/Kolkata
      FlexibleTimeWindow: {Mode: "FLEXIBLE", MaximumWindowInMinutes: 30}
      Target:
        Arn: !Ref WeeklyStateMachine
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"areas": ["bengaluru", "chennai", "hyderabad", "delhi-ncr", "kochi", "sivasagar", "bhadrak", "kathmandu", "butwal"]}'

  DailyRainSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${Project}-daily-rain"
      Description: Every morning 06:15 IST - email a heads-up to people whose followed places expect heavy rain
      ScheduleExpression: "cron(15 6 * * ? *)"
      ScheduleExpressionTimezone: Asia/Kolkata
      FlexibleTimeWindow: {Mode: "FLEXIBLE", MaximumWindowInMinutes: 15}
      Target:
        Arn: !GetAtt AlertsFn.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"source": "schedule"}'
        RetryPolicy: {MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 3600}

  # ----------------------------------------------------------------------------------------- website
  # Without CloudFront (Website=api), API Gateway proxies the website and /pub/ data from the public site bucket:
  # /assets/* and /pub/* map to the same keys, a few root files to theirs, and every other path (the app's own
  # routes) falls through to the $default route, which serves index.html.
  SiteIndexIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: NoCdn
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: GET
      IntegrationUri: !Sub "https://${SiteBucket.RegionalDomainName}/index.html"
      PayloadFormatVersion: "1.0"
  SiteAssetsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: NoCdn
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: GET
      IntegrationUri: !Sub "https://${SiteBucket.RegionalDomainName}/assets/{proxy}"
      PayloadFormatVersion: "1.0"
  SitePubIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: NoCdn
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: GET
      IntegrationUri: !Sub "https://${SiteBucket.RegionalDomainName}/pub/{proxy}"
      PayloadFormatVersion: "1.0"
  SiteConfigIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: NoCdn
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: GET
      IntegrationUri: !Sub "https://${SiteBucket.RegionalDomainName}/config.json"
      PayloadFormatVersion: "1.0"
  SiteIconIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: NoCdn
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: GET
      IntegrationUri: !Sub "https://${SiteBucket.RegionalDomainName}/favicon.svg"
      PayloadFormatVersion: "1.0"
  SiteDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: NoCdn
    Properties: {ApiId: !Ref HttpApi, RouteKey: $default, Target: !Sub "integrations/${SiteIndexIntegration}"}
  SiteAssetsRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: NoCdn
    Properties: {ApiId: !Ref HttpApi, RouteKey: "GET /assets/{proxy+}", Target: !Sub "integrations/${SiteAssetsIntegration}"}
  SitePubRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: NoCdn
    Properties: {ApiId: !Ref HttpApi, RouteKey: "GET /pub/{proxy+}", Target: !Sub "integrations/${SitePubIntegration}"}
  SiteConfigRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: NoCdn
    Properties: {ApiId: !Ref HttpApi, RouteKey: "GET /config.json", Target: !Sub "integrations/${SiteConfigIntegration}"}
  SiteIconRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: NoCdn
    Properties: {ApiId: !Ref HttpApi, RouteKey: "GET /favicon.svg", Target: !Sub "integrations/${SiteIconIntegration}"}

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: UseCdn
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${Project}-site-oac-${AWS::Region}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SpaRouter:
    Type: AWS::CloudFront::Function
    Condition: UseCdn
    Properties:
      Name: !Sub "${Project}-spa-router-${AWS::Region}"
      AutoPublish: true
      FunctionConfig: {Comment: "Serve index.html for app routes", Runtime: cloudfront-js-2.0}
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          var last = r.uri.split('/').pop();
          if (r.uri.indexOf('/pub/') !== 0 && r.uri.indexOf('/assets/') !== 0 && last.indexOf('.') === -1) {
            r.uri = '/index.html';
          }
          return r;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: UseCdn
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${Project} website, public data and API"
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig: {OriginAccessIdentity: ""}
          - Id: api
            DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2]}
            OriginCustomHeaders:
              - {HeaderName: X-JalSmriti-Origin, HeaderValue: !Select [2, !Split ["/", !Ref AWS::StackId]]}
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouter.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /v1/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
            Compress: true
          - PathPattern: /pub/*
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: 5cc3b908-e619-4b99-88e5-2cf7f45965bd # Managed-CORS-With-Preflight
            Compress: true

  # ----------------------------------------------------------------------------------------- observability
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${Project}"
      DashboardBody: !Sub |
        {"widgets": [
          {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Lambda invocations and errors","region":"${AWS::Region}","stat":"Sum","period":3600,
            "metrics":[["AWS/Lambda","Invocations","FunctionName","${Project}-api"],[".","Errors",".","."],["AWS/Lambda","Invocations","FunctionName","${Project}-geo"],[".","Errors",".","."],["AWS/Lambda","Errors","FunctionName","${Project}-evidence"],["AWS/Lambda","Errors","FunctionName","${Project}-jobs"],["AWS/Lambda","Errors","FunctionName","${Project}-alerts"]]}},
          {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Workflows","region":"${AWS::Region}","stat":"Sum","period":3600,
            "metrics":[["AWS/States","ExecutionsSucceeded","StateMachineArn","arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Project}-place"],[".","ExecutionsFailed",".","."],["AWS/States","ExecutionsSucceeded","StateMachineArn","arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Project}-lake"],[".","ExecutionsFailed",".","."],["AWS/States","ExecutionsSucceeded","StateMachineArn","arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Project}-area"],[".","ExecutionsFailed",".","."]]}},
          {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"API latency (p90) and 5xx","region":"${AWS::Region}","period":300,
            "metrics":[["AWS/ApiGateway","Latency","ApiId","${HttpApi}",{"stat":"p90"}],[".","5xx",".",".",{"stat":"Sum"}]]}},
          {"type":"metric","x":12,"y":6,"width":12,"height":6,"properties":{"title":"Queues (evidence, jobs)","region":"${AWS::Region}","stat":"Maximum","period":300,
            "metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${EvidenceQueue.QueueName}"],[".",".",".","${JobsQueue.QueueName}"],[".",".",".","${EvidenceDLQ.QueueName}"],[".",".",".","${JobsDLQ.QueueName}"]]}}
        ]}

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-api-errors"
      AlarmDescription: The API function is failing
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFn}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  DeadLettersAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-dead-letters"
      AlarmDescription: Dossier jobs failed repeatedly
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt JobsDLQ.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  EvidenceDeadLettersAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-evidence-dead-letters"
      AlarmDescription: Photo processing failed repeatedly
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt EvidenceDLQ.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  SiteUrl:
    Value: !If [UseCdn, !Sub "https://${Distribution.DomainName}", !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"]
  Website:
    Value: !Ref Website
  DistributionId:
    Condition: UseCdn
    Value: !Ref Distribution
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref Table
  DataBucketName:
    Value: !Ref DataBucket
  SiteBucketName:
    Value: !Ref SiteBucket
  AreaStateMachineArn:
    Value: !Ref AreaStateMachine
  PlaceStateMachineArn:
    Value: !Ref PlaceStateMachine
  LakeStateMachineArn:
    Value: !Ref LakeStateMachine
  WeeklyStateMachineArn:
    Value: !Ref WeeklyStateMachine
  PreloadStateMachineArn:
    Value: !Ref PreloadStateMachine
  GeoFunctionName:
    Value: !Ref GeoFn
  JobsFunctionName:
    Value: !Ref JobsFn
  EvidenceFunctionName:
    Value: !Ref EvidenceFn
  AlertsFunctionName:
    Value: !Ref AlertsFn
  SigningKeyArn:
    Value: !GetAtt SigningKey.Arn
